# Production stack for a single VPS (e.g. Hostinger KVM) behind a Cloudflare Tunnel.
#   browser → Cloudflare (HTTPS) → cloudflared → caddy:80 → web / api
#   https://DOMAIN/         → Nuxt web
#   https://DOMAIN/api/*    → Rust API   (also webhooks: /api/webhooks/meta, /api/webhooks/tiktok)
#   https://DOMAIN/media/*  → uploaded files (served by the API)
#
# The server holds no source code: only this file, deploy/{Caddyfile,deploy.sh,backup.sh} and
# .env.prod. The api/web images are built elsewhere (GitHub Actions, or deploy/ship.ps1 on your PC)
# and started with:  bash deploy/deploy.sh <api-image> <web-image>
# deploy.sh records the running images in deploy/.release.env; pass it to manual compose commands:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod --env-file deploy/.release.env ps
#
# Nothing is exposed publicly: cloudflared dials out to Cloudflare. Caddy is bound to
# 127.0.0.1:8081 only, for local debugging (curl http://127.0.0.1:8081/api/health).

name: zaokaiy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zaokaiy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: zaokaiy
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaokaiy"]
      interval: 5s
      retries: 20

  api:
    # prebuilt image only (no build: on the server) - set by deploy/deploy.sh in deploy/.release.env
    image: ${API_IMAGE:?API_IMAGE not set - pass --env-file deploy/.release.env or run deploy/deploy.sh}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://zaokaiy:${POSTGRES_PASSWORD}@db:5432/zaokaiy
      BIND_ADDR: 0.0.0.0:8080
      # Super app: which cores run in this container (all | platform,commerce,vehicle,restaurant,insurance,finance).
      # To move a core to its own container, run another api service with ZK_CORES=<core> and set
      # ZK_REMOTE_<CORE>=http://<service>:8080 here.
      ZK_CORES: ${ZK_CORES:-all}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.prod}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-168}
      CORS_ORIGINS: https://${DOMAIN}
      PUBLIC_WEB_URL: https://${DOMAIN}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      PRODUCT_REVIEW: ${PRODUCT_REVIEW:-required}
      REVIEW_ON_EDIT: ${REVIEW_ON_EDIT:-true}
      # Media: local disk (volume below) by default, or S3-compatible storage
      MEDIA_DRIVER: ${MEDIA_DRIVER:-local}
      MEDIA_DIR: /app/media
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-https://${DOMAIN}/media}
      MEDIA_MAX_IMAGE_MB: ${MEDIA_MAX_IMAGE_MB:-15}
      MEDIA_MAX_VIDEO_MB: ${MEDIA_MAX_VIDEO_MB:-200}
      MEDIA_MIN_IMAGE_EDGE: ${MEDIA_MIN_IMAGE_EDGE:-500}
      # Corporate KYC: encrypted documents in a private volume (never served)
      PRIVATE_DIR: /app/private
      KYC_ENCRYPTION_KEY: ${KYC_ENCRYPTION_KEY:?set KYC_ENCRYPTION_KEY in .env.prod (openssl rand -base64 32)}
      KYB_REQUIRED_TO_PUBLISH: ${KYB_REQUIRED_TO_PUBLISH:-true}
      KYB_REVIEW_MONTHS: ${KYB_REVIEW_MONTHS:-12}
      KYC_S3_BUCKET: ${KYC_S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      # Module: COD risk (see README → COD risk)
      COD_RISK_ENABLED: ${COD_RISK_ENABLED:-true}
      COD_RISK_PEPPER: ${COD_RISK_PEPPER:?set COD_RISK_PEPPER in .env.prod (openssl rand -base64 32)}
      COD_RISK_BLOCK_COD_AT: ${COD_RISK_BLOCK_COD_AT:-blocked}
      COD_RISK_REPORT_WINDOW_DAYS: ${COD_RISK_REPORT_WINDOW_DAYS:-30}
      COD_RISK_ANCHOR: ${COD_RISK_ANCHOR:-none}
      COD_RISK_ANCHOR_URL: ${COD_RISK_ANCHOR_URL:-}
      COD_RISK_ANCHOR_SECRET: ${COD_RISK_ANCHOR_SECRET:-}
      COD_RISK_ANCHOR_EVERY_SECS: ${COD_RISK_ANCHOR_EVERY_SECS:-300}
      COD_RISK_LEDGER_NAME: ${COD_RISK_LEDGER_NAME:-zaokaiy-cod-risk}
      # Module: image suggestions (see README → Image suggestions)
      IMAGE_SUGGEST_ENABLED: ${IMAGE_SUGGEST_ENABLED:-true}
      IMAGE_SUGGEST_SHARED: ${IMAGE_SUGGEST_SHARED:-true}
      # AI (empty key = offline template mode)
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-google/gemini-3.8-flash}
      AI_FALLBACK_MODELS: ${AI_FALLBACK_MODELS:-}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-zaokaiy}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
      AI_OFFLINE_ON_BUSY: ${AI_OFFLINE_ON_BUSY:-true}
      # Social selling webhooks
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_GRAPH_URL: ${META_GRAPH_URL:-https://graph.facebook.com/v21.0}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      # Social login (callbacks: https://DOMAIN/api/auth/oauth/{google|facebook}/callback)
      PUBLIC_API_URL: https://${DOMAIN}/api
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_OTP_TEMPLATE: ${WHATSAPP_OTP_TEMPLATE:-zaokaiy_login}
      WHATSAPP_OTP_LANG: ${WHATSAPP_OTP_LANG:-en_US}
      WHATSAPP_OTP_LANG_LO: ${WHATSAPP_OTP_LANG_LO:-}
      # Cloudflare Turnstile human check (off while either key is empty)
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      RUST_LOG: ${RUST_LOG:-info}
    volumes: [media:/app/media, private:/app/private]

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE not set - pass --env-file deploy/.release.env or run deploy/deploy.sh}
    restart: unless-stopped
    depends_on: [api]
    environment:
      NUXT_PUBLIC_API_BASE: https://${DOMAIN}/api   # browser → API (through Caddy)
      NUXT_API_BASE_SERVER: http://api:8080/api     # SSR → API (private network)
      NUXT_PUBLIC_I18N_BASE_URL: https://${DOMAIN}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api, web]
    ports: ["127.0.0.1:8081:80"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Cloudflare Tunnel. In Zero Trust → Networks → Tunnels, set the public hostname
  # DOMAIN → service  http://caddy:80
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on: [caddy]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env.prod}

volumes:
  pgdata:
  media:
  private:
  caddy_data:
  caddy_config:
