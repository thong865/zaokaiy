services:
  api:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://postgres:12345678@localhost:5432/zaokaiy
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: http://localhost:3000
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-google/gemini-3.8-flash}
      AI_FALLBACK_MODELS: ${AI_FALLBACK_MODELS:-}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-zaokaiy}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
      AI_OFFLINE_ON_BUSY: ${AI_OFFLINE_ON_BUSY:-true}
      RUST_LOG: info
    ports: ["8080:8080"]

  web:
    build: ./frontend
    depends_on: [api]
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8080/api   # browser → API
      NUXT_API_BASE_SERVER: http://api:8080/api         # SSR (container) → API
    ports: ["3000:3000"]

volumes:
  pgdata:
