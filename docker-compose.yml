services:
  api:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://postgres:12345678@localhost:5432/zaokaiy
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: http://localhost:3000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5}
      RUST_LOG: info
    ports: ["8080:8080"]

  web:
    build: ./frontend
    depends_on: [api]
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8080/api   # browser → API
      NUXT_API_BASE_SERVER: http://api:8080/api         # SSR (container) → API
    ports: ["3000:3000"]

volumes:
  pgdata:
